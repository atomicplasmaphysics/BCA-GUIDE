# Type checking with mypy: mypy
[mypy]
files = Containers, Pages, Simulations, TableWidgets, Utility, main.py
exclude = (Simulation Programs|testcode|setup|resources\.py)
explicit_package_bases = True
ignore_missing_imports = True
allow_redefinition = True
# also the bodies of functions without type annotations are checked
check_untyped_defs = True
