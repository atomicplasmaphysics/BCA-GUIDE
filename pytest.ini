[pytest]
testpaths = tests
# the tests run in parallel processes (pytest-xdist), use "-n 0" to run them in one process; tests with the same
# xdist_group run in the same process (e.g. simulations that need a lot of memory)
addopts = -p no:cacheprovider -n auto --dist loadgroup
filterwarnings =
    ignore:invalid value encountered:RuntimeWarning
